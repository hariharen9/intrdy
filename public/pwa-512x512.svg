<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1015" />
      <stop offset="50%" stop-color="#121820" />
      <stop offset="100%" stop-color="#18222B" />
    </linearGradient>
    <linearGradient id="rdyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3FC7B8" />
      <stop offset="100%" stop-color="#4EEDDC" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3FC7B8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#26313B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#141B22" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield / App Icon -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Subtle Inner Top Accent Line -->
  <path d="M 120 40 L 392 40" stroke="#3FC7B8" stroke-width="3" stroke-linecap="round" opacity="0.4" />

  <!-- Subtle Terminal / Grid Background Accents -->
  <g opacity="0.08" stroke="#E7EDF2" stroke-width="1.5">
    <line x1="64" y1="170" x2="448" y2="170" stroke-dasharray="6,6" />
    <line x1="64" y1="340" x2="448" y2="340" stroke-dasharray="6,6" />
    <line x1="256" y1="64" x2="256" y2="448" stroke-dasharray="6,6" />
  </g>

  <!-- Terminal Bracket Accent -->
  <path d="M 68 180 L 52 256 L 68 332" fill="none" stroke="#3FC7B8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />
  <path d="M 444 180 L 460 256 L 444 332" fill="none" stroke="#3FC7B8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />

  <!-- Stacked Brand Typography: INT / RDY -->
  <!-- Top: INT -->
  <text
    x="256"
    y="228"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'JetBrains Mono', 'Inter', monospace, sans-serif"
    font-weight="900"
    font-size="156"
    letter-spacing="8"
    fill="#E7EDF2"
  >INT</text>

  <!-- Bottom: RDY with Vibrant Glow -->
  <g filter="url(#glow)">
    <text
      x="256"
      y="386"
      text-anchor="middle"
      font-family="system-ui, -apple-system, 'JetBrains Mono', 'Inter', monospace, sans-serif"
      font-weight="900"
      font-size="156"
      letter-spacing="8"
      fill="url(#rdyGrad)"
    >RDY</text>
  </g>

  <!-- Active Status / Prompt Blinking Indicator Dot -->
  <circle cx="410" cy="370" r="11" fill="#3FC7B8" />
</svg>
